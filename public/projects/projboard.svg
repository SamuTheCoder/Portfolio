  <text x="187" y="62" fill="#7f94a3" font-family="Arial,sans-serif" font-size="10">PROJECT / DESIGN SYSTEM</text>
  <rect x="673" y="22" width="105" height="32" rx="6" fill="#3b8ff1"/><text x="692" y="42" fill="white" font-family="Arial,sans-serif" font-size="12">+ New Task</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(187 83)"><rect width="138" height="260" rx="7" fill="#22313e"/><text x="12" y="24" fill="#d7e4ec" font-size="12">Backlog</text><text x="117" y="24" fill="#718898" font-size="11">5</text><rect x="9" y="38" width="120" height="69" rx="5" fill="#344451"/><text x="17" y="57" fill="#e6edf1" font-size="9">Improve landing page</text><rect x="17" y="78" width="33" height="14" rx="7" fill="#d46572"/><text x="25" y="88" fill="white" font-size="7">High</text><rect x="9" y="118" width="120" height="67" rx="5" fill="#344451"/><text x="17" y="137" fill="#e6edf1" font-size="9">Fix mobile navigation</text></g>
    <g transform="translate(337 83)"><rect width="138" height="260" rx="7" fill="#22313e"/><text x="12" y="24" fill="#75bff2" font-size="12">In Progress</text><text x="117" y="24" fill="#718898" font-size="11">3</text><rect x="9" y="38" width="120" height="69" rx="5" fill="#344451"/><text x="17" y="57" fill="#e6edf1" font-size="9">User authentication</text><rect x="9" y="118" width="120" height="67" rx="5" fill="#344451"/><text x="17" y="137" fill="#e6edf1" font-size="9">Design documentation</text></g>
    <g transform="translate(487 83)"><rect width="138" height="260" rx="7" fill="#22313e"/><text x="12" y="24" fill="#d7e4ec" font-size="12">Review</text><text x="117" y="24" fill="#718898" font-size="11">2</text><rect x="9" y="38" width="120" height="69" rx="5" fill="#344451"/><text x="17" y="57" fill="#e6edf1" font-size="9">Design system</text><rect x="9" y="118" width="120" height="67" rx="5" fill="#344451"/><text x="17" y="137" fill="#e6edf1" font-size="9">Deploy to production</text></g>
    <g transform="translate(637 83)"><rect width="141" height="260" rx="7" fill="#22313e"/><text x="12" y="24" fill="#8ed7a8" font-size="12">Done</text><text x="120" y="24" fill="#718898" font-size="11">4</text><rect x="9" y="38" width="123" height="69" rx="5" fill="#344451"/><text x="17" y="57" fill="#e6edf1" font-size="9">API integration</text><rect x="9" y="118" width="123" height="67" rx="5" fill="#344451"/><text x="17" y="137" fill="#e6edf1" font-size="9">Deploy to production</text></g>
