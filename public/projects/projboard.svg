<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
  <title id="title">ProjBoard interface preview</title>
  <desc id="desc">A dark project management dashboard with navigation and four kanban columns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b25"/><stop offset="1" stop-color="#1c2a35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="370" rx="12" fill="url(#bg)"/>
  <rect x="16" y="16" width="150" height="338" rx="8" fill="#182633"/>
  <circle cx="35" cy="38" r="10" fill="#4899e8"/><path d="M31 42v-9h7v9" fill="none" stroke="#dff3ff" stroke-width="2"/>
  <text x="53" y="43" fill="#f1f6fa" font-family="Arial,sans-serif" font-size="16" font-weight="700">ProjBoard</text>
  <g font-family="Arial,sans-serif" font-size="12" fill="#adc0cc">
