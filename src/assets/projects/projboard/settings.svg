  <text x="230" y="55" fill="#20323c" font-family="Arial" font-size="24" font-weight="700">Project Settings</text><text x="230" y="82" fill="#687984" font-family="Arial" font-size="13">Configure Website Redesign.</text>
  <rect x="225" y="120" width="620" height="420" rx="9" fill="#fff" stroke="#cbd6dc"/><text x="255" y="158" fill="#20323c" font-family="Arial" font-size="16" font-weight="700">General settings</text><g fill="#63747f" font-family="Arial" font-size="12"><text x="255" y="205">PROJECT NAME</text><text x="255" y="292">DESCRIPTION</text><text x="255" y="410">VISIBILITY</text></g><rect x="255" y="218" width="560" height="42" rx="6" fill="#f8fafb" stroke="#cbd6dc"/><text x="270" y="244" fill="#263944" font-family="Arial" font-size="13">Website Redesign</text><rect x="255" y="305" width="560" height="78" rx="6" fill="#f8fafb" stroke="#cbd6dc"/><rect x="255" y="430" width="44" height="24" rx="12" fill="#4d9bee"/><circle cx="287" cy="442" r="9" fill="white"/><rect x="255" y="480" width="118" height="38" rx="6" fill="#3c91ec"/><text x="280" y="504" fill="white" font-family="Arial" font-size="12">Save changes</text>
