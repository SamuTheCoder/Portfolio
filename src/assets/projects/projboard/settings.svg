<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ProjBoard settings placeholder</title><desc id="desc">A placeholder project settings page with general, workflow and notification controls.</desc>
