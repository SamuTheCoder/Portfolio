<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ProjBoard task details placeholder</title><desc id="desc">A placeholder task details screen with task metadata, description and comments.</desc>
  <rect width="1200" height="600" fill="#edf2f5"/><rect width="190" height="600" fill="#172630"/><text x="26" y="40" fill="#f2f6f8" font-family="Arial" font-size="20" font-weight="700">⌘ ProjBoard</text><g fill="#b9c7cf" font-family="Arial" font-size="14"><text x="30" y="100">Projects</text><text x="30" y="150">My Tasks</text><text x="30" y="200">Calendar</text><text x="30" y="250">Members</text></g>
  <text x="230" y="55" fill="#20323c" font-family="Arial" font-size="24" font-weight="700">Implement authentication</text><rect x="230" y="82" width="72" height="24" rx="12" fill="#ffe1e0"/><text x="250" y="99" fill="#b84444" font-family="Arial" font-size="11">High</text>
  <rect x="230" y="135" width="610" height="155" rx="9" fill="#fff" stroke="#cfdae0"/><text x="255" y="168" fill="#21343e" font-family="Arial" font-size="15" font-weight="700">Description</text><g fill="#687985" font-family="Arial" font-size="13"><text x="255" y="202">Add secure JWT authentication and refresh-token rotation.</text><text x="255" y="228">Protect project routes and handle expired sessions consistently.</text></g>
  <rect x="230" y="310" width="610" height="230" rx="9" fill="#fff" stroke="#cfdae0"/><text x="255" y="344" fill="#21343e" font-family="Arial" font-size="15" font-weight="700">Comments</text><circle cx="270" cy="386" r="18" fill="#68a9ed"/><rect x="300" y="367" width="495" height="62" rx="7" fill="#eef3f6"/><circle cx="270" cy="472" r="18" fill="#53ba8a"/><rect x="300" y="453" width="420" height="62" rx="7" fill="#eef3f6"/>
  <rect x="875" y="135" width="285" height="405" rx="9" fill="#fff" stroke="#cfdae0"/><text x="900" y="169" fill="#21343e" font-family="Arial" font-size="15" font-weight="700">Task details</text><g fill="#6a7a84" font-family="Arial" font-size="12"><text x="900" y="220">STATUS</text><text x="900" y="280">ASSIGNEE</text><text x="900" y="340">REVIEWER</text><text x="900" y="400">DUE DATE</text></g><g fill="#253945" font-family="Arial" font-size="14"><text x="900" y="244">In Progress</text><text x="900" y="304">Samuel Teixeira</text><text x="900" y="364">Morgan Lee</text><text x="900" y="424">24 September 2026</text></g>
</svg>
